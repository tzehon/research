name: perf-agent-demo
services:
  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: local-demo-only
      POSTGRES_DB: storefront
    ports: ['127.0.0.1:54329:5432']
    volumes:
      - demo-db:/var/lib/postgresql/data
      - ./fixtures/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./fixtures:/demo-fixtures:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U demo -d storefront']
      interval: 2s
      timeout: 3s
      retries: 30
  lgtm:
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/ready']
      interval: 2s
      timeout: 3s
      retries: 90
    image: grafana/otel-lgtm:0.36.0@sha256:57c04cbd8e7022f32bb84c4ac005d79baf8b08e2c5be44facf11f5f1f9944ba2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PATHS_PROVISIONING: /demo-provisioning
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
    ports:
      [
        '127.0.0.1:3001:3000',
        '127.0.0.1:9091:9090',
        '127.0.0.1:4318:4318',
        '127.0.0.1:3101:3100',
        '127.0.0.1:3201:3200',
      ]
    volumes:
      - demo-telemetry:/data
      - ./config/otelcol.yaml:/otel-lgtm/otelcol-config.yaml:ro
      - ./grafana:/demo-provisioning:ro
volumes:
  demo-db:
  demo-telemetry:
