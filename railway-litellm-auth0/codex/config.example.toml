model = "gpt-6.1-sol"
model_provider = "railway-auth0-lab"
# Generated by codex-config/codex-install from your normal Codex model cache.
model_catalog_json = "/ABSOLUTE/PATH/TO/railway-litellm-auth0/.local/gateway-models-HASH.json"
web_search = "disabled"

[model_providers.railway-auth0-lab]
name = "Railway Auth0 Lab"
base_url = "https://YOUR-GATEWAY.up.railway.app/v1"
wire_api = "responses"
supports_websockets = false

[model_providers.railway-auth0-lab.gateway_oauth]
# The installer generates a new public demo marker on each switch.
# --reuse-login omits prompt and codex_demo_run for normal session reuse.
authorization_url = "https://YOUR-TENANT.us.auth0.com/authorize?audience=https%3A%2F%2Fcodex-gateway-lab&connection=codex-gateway-lab-users&prompt=login&codex_demo_run=GENERATED_PER_INSTALL"
token_url = "https://YOUR-TENANT.us.auth0.com/oauth/token"
client_id = "PUBLIC_NATIVE_CLIENT_ID"
scopes = ["openid", "profile", "offline_access", "llm:invoke"]
redirect_port = 43127
# Omit delivery to send the OAuth access token as Authorization: Bearer <token>.
