services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_PASSWORD: test-password-only
      POSTGRES_DB: litellm
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30
  litellm:
    build: ../../litellm
    environment:
      DATABASE_URL: postgresql://postgres:test-password-only@postgres:5432/litellm
      LITELLM_MASTER_KEY: sk-integration-master-key-not-a-real-secret
      LITELLM_SALT_KEY: integration-salt-not-a-real-secret
      OPENAI_API_KEY: sk-test-key-never-used-for-inference
      ALLOWED_MODELS: '["gpt-6.1-sol"]'
    ports: ["127.0.0.1::4000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 5s
      timeout: 5s
      retries: 60
